&lt;script&gt;
  (function () {
    const root = document.getElementById(&#x27;vk-renderer-flow-h5&#x27;);
    const canvas = root.querySelector(&#x27;[data-canvas]&#x27;);
    const detail = root.querySelector(&#x27;[data-detail]&#x27;);
    const progress = root.querySelector(&#x27;[data-progress]&#x27;);
    const viewLabel = root.querySelector(&#x27;[data-view-label]&#x27;);
    const indexLegend = root.querySelector(&#x27;[data-index-legend]&#x27;);
    const prevButton = root.querySelector(&#x27;[data-action=&quot;prev&quot;]&#x27;);
    const nextButton = root.querySelector(&#x27;[data-action=&quot;next&quot;]&#x27;);
    const viewButtons = Array.from(root.querySelectorAll(&#x27;[data-view]&#x27;));

    const views = {
      overview: {
        label: &#x27;生命周期主线&#x27;,
        kind: &#x27;linear&#x27;,
        steps: [
          {
            label: &#x27;initWindow&#x27;,
            detail: &#x27;初始化 GLFW，创建无 OpenGL 上下文的窗口，并注册 framebuffer resize 回调。&#x27;,
            source: &#x27;VKApp.cpp:11-27&#x27;
          },
          {
            label: &#x27;initVulkan&#x27;,
            detail: &#x27;按依赖创建 Instance → Surface → Device → Swapchain → Pipeline → GPU 资源 → Command Buffers → Sync。&#x27;,
            source: &#x27;VKApp.cpp:29-53&#x27;
          },
          {
            label: &#x27;mainLoop&#x27;,
            detail: &#x27;轮询窗口事件；若交换链需要重建则先处理，否则进入 drawFrame。&#x27;,
            source: &#x27;VKApp.cpp:90-111&#x27;
          },
          {
            label: &#x27;drawFrame&#x27;,
            detail: &#x27;在 CPU、WSI、Graphics Queue 与 Present Queue 之间建立一帧的等待与信号链。&#x27;,
            source: &#x27;VKRenderer.cpp:109-190&#x27;
          },
          {
            label: &#x27;cleanup&#x27;,
            detail: &#x27;GPU 空闲后，按依赖反序释放同步对象、交换链依赖、Buffer、Device、Surface、Instance 与 Window。&#x27;,
            source: &#x27;VKApp.cpp:55-80&#x27;
          }
        ]
      },
      frame: {
        label: &#x27;Acquire → Submit → Present&#x27;,
        kind: &#x27;lanes&#x27;,
        steps: [
          {
            label: &#x27;wait Fence[F]&#x27;,
            shortLabel: &#x27;Fence[F]&#x27;,
            lane: &#x27;CPU&#x27;,
            detail: &#x27;CPU 等待帧槽 F 上一次 Graphics Submit 完成，确保这套帧槽资源可以复用。&#x27;,
            source: &#x27;VKRenderer.cpp:111&#x27;
          },
          {
            label: &#x27;Acquire image I&#x27;,
            shortLabel: &#x27;Acquire I&#x27;,
            lane: &#x27;WSI&#x27;,
            detail: &#x27;Acquire 返回交换链图像 I，并在图像可用时信号 imageAvailable[F]；Out-of-date 会在 Reset Fence 前返回。&#x27;,
            source: &#x27;VKRenderer.cpp:113-134&#x27;
          },
          {
            label: &#x27;wait Owner[I]&#x27;,
            shortLabel: &#x27;Owner[I]&#x27;,
            lane: &#x27;CPU&#x27;,
            detail: &#x27;若 imagesInFlight[I] 非空，等待其中保存的 Fence，避免覆盖仍被 GPU 使用的按图像资源。&#x27;,
            source: &#x27;VKRenderer.cpp:136-140&#x27;
          },
          {
            label: &#x27;update UBO[I]&#x27;,
            shortLabel: &#x27;UBO[I]&#x27;,
            lane: &#x27;CPU&#x27;,
            detail: &#x27;图像 I 已安全后，更新 uniformBuffers[I]；对应 Descriptor Set 与 Command Buffer 也都按 I 选择。&#x27;,
            source: &#x27;VKRenderer.cpp:142&#x27;
          },
          {
            label: &#x27;reset + submit&#x27;,
            shortLabel: &#x27;Submit&#x27;,
            lane: &#x27;CPU&#x27;,
            detail: &#x27;Reset inFlightFence[F]，提交 commandBuffer[I]，并在 COLOR_ATTACHMENT_OUTPUT 等待 imageAvailable[F]。&#x27;,
            source: &#x27;VKRenderer.cpp:144-166&#x27;
          },
          {
            label: &#x27;execute CB[I]&#x27;,
            shortLabel: &#x27;Execute&#x27;,
            lane: &#x27;Graphics&#x27;,
            detail: &#x27;Graphics Queue 执行 Render Pass 与 DrawIndexed，完成后信号 Frame Fence 和渲染完成 Semaphore。&#x27;,
            source: &#x27;VKRenderer.cpp:150-166&#x27;
          },
          {
            label: &#x27;present image I&#x27;,
            shortLabel: &#x27;Present I&#x27;,
            lane: &#x27;Present&#x27;,
            detail: &#x27;Present Queue 等待渲染完成 Semaphore 后呈现 I。当前代码按 F 复用该 Semaphore，建议改为按 I。&#x27;,
            source: &#x27;VKRenderer.cpp:168-187&#x27;,
            risk: &#x27;Present Semaphore 复用风险&#x27;
          },
          {
            label: &#x27;next frame slot&#x27;,
            shortLabel: &#x27;Next F&#x27;,
            lane: &#x27;CPU&#x27;,
            detail: &#x27;只推进帧槽 F；下一帧的图像 I 仍由 Acquire 决定，因此 F 与 I 不能混用。&#x27;,
            source: &#x27;VKRenderer.cpp:189&#x27;
          }
        ]
      },
      rebuild: {
        label: &#x27;Swapchain Bundle 替换&#x27;,
        kind: &#x27;linear&#x27;,
        steps: [
          {
            label: &#x27;request&#x27;,
            detail: &#x27;Resize callback、Acquire 或 Present 的 OUT_OF_DATE/SUBOPTIMAL 状态提出重建请求。&#x27;,
            source: &#x27;VKSwapchain.cpp:76-90&#x27;
          },
          {
            label: &#x27;wait extent&#x27;,
            detail: &#x27;等待 framebuffer 尺寸非零；最小化期间不能创建有效交换链。&#x27;,
            source: &#x27;VKSwapchain.cpp:160-169&#x27;
          },
          {
            label: &#x27;Device Idle&#x27;,
            detail: &#x27;等待所有 GPU 工作结束，保证旧 Framebuffer、Depth、Pipeline、Descriptor 与 Command Buffer 不再使用。&#x27;,
            source: &#x27;VKSwapchain.cpp:171&#x27;
          },
          {
            label: &#x27;make new&#x27;,
            detail: &#x27;先用 oldSwapchain 创建替代对象；新 Swapchain 创建失败时，旧 Swapchain 本体仍保持有效。&#x27;,
            source: &#x27;VKSwapchain.cpp:173-175&#x27;
          },
          {
            label: &#x27;destroy dependents&#x27;,
            detail: &#x27;释放旧 Command Buffers、Framebuffers、Depth、Pipeline、Render Pass、Descriptor Pool 与 per-image UBO。&#x27;,
            source: &#x27;VKSwapchain.cpp:92-152&#x27;
          },
          {
            label: &#x27;move replace&#x27;,
            detail: &#x27;移动赋值新 Swapchain；VulkanSwapchain RAII 在此销毁旧 Image Views 与旧 Swapchain。&#x27;,
            source: &#x27;VKSwapchain.cpp:176-177&#x27;
          },
          {
            label: &#x27;rebuild bundle&#x27;,
            detail: &#x27;更新 Camera aspect，重建 RenderPass、Pipeline、Depth、Framebuffer、UBO、Descriptor 与 Command Buffer。&#x27;,
            source: &#x27;VKSwapchain.cpp:179-193&#x27;
          },
          {
            label: &#x27;reset ownership&#x27;,
            detail: &#x27;按新 image count 重置 imagesInFlight，并清除重建请求。&#x27;,
            source: &#x27;VKSwapchain.cpp:194-196&#x27;
          }
        ]
      },
      cleanup: {
        label: &#x27;依赖反序销毁&#x27;,
        kind: &#x27;linear&#x27;,
        steps: [
          {
            label: &#x27;Device Idle&#x27;,
            detail: &#x27;正常退出在 mainLoop 尾部等待 Device 空闲；Cleanup 的安全性当前依赖这一调用顺序。&#x27;,
            source: &#x27;VKApp.cpp:110&#x27;
          },
          {
            label: &#x27;Sync Objects&#x27;,
            detail: &#x27;销毁 Frame Slot 使用的 Semaphore 与 Fence。&#x27;,
            source: &#x27;VKApp.cpp:57-62&#x27;
          },
          {
            label: &#x27;Command Buffers&#x27;,
            detail: &#x27;先释放引用 Framebuffer、Pipeline、Descriptor、Vertex/Index Buffer 的 Command Buffers。&#x27;,
            source: &#x27;VKSwapchain.cpp:94-102&#x27;
          },
          {
            label: &#x27;Framebuffer&#x27;,
            detail: &#x27;销毁 Framebuffer 后，才可以继续销毁其中引用的 Image Views 与 Render Pass。&#x27;,
            source: &#x27;VKSwapchain.cpp:104-108&#x27;
          },
          {
            label: &#x27;Depth + Pipeline&#x27;,
            detail: &#x27;Depth 按 View → Image → Memory 销毁；Pipeline 按 Pipeline → Layout → RenderPass 销毁。&#x27;,
            source: &#x27;VKSwapchain.cpp:110-140&#x27;
          },
          {
            label: &#x27;Descriptor + UBO&#x27;,
            detail: &#x27;先销毁 Descriptor Pool 回收 Sets，再清空它们引用的 Uniform Buffers。&#x27;,
            source: &#x27;VKSwapchain.cpp:142-150&#x27;
          },
          {
            label: &#x27;Swapchain&#x27;,
            detail: &#x27;VulkanSwapchain 先销毁应用拥有的 Image Views，再销毁 Swapchain；Swapchain Images 不单独销毁。&#x27;,
            source: &#x27;VulkanSwapchain.cpp:187-207&#x27;
          },
          {
            label: &#x27;Scene Buffers&#x27;,
            detail: &#x27;Index/Vertex Buffer 按 Buffer → Memory 释放，然后销毁 Descriptor Set Layout 与 Command Pool。&#x27;,
            source: &#x27;VKApp.cpp:65-70&#x27;
          },
          {
            label: &#x27;Device → Window&#x27;,
            detail: &#x27;最后销毁 Device、Debug Messenger、Surface、Instance、GLFW Window，并终止 GLFW。&#x27;,
            source: &#x27;VKApp.cpp:71-79&#x27;
          }
        ]
      }
    };

    let activeView = &#x27;overview&#x27;;
    let activeStep = 0;

    function makeStepButton(step, index) {
      const button = document.createElement(&#x27;button&#x27;);
      button.type = &#x27;button&#x27;;
      button.className = &#x27;btn&#x27;;
      button.dataset.stepIndex = String(index);
      button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
      button.textContent = step.shortLabel || step.label;
      button.addEventListener(&#x27;click&#x27;, function () {
        activeStep = index;
        renderSelection();
      });
      return button;
    }

    function makeArrow() {
      const arrow = document.createElement(&#x27;span&#x27;);
      arrow.className = &#x27;vr-arrow&#x27;;
      arrow.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
      const wide = document.createElement(&#x27;span&#x27;);
      wide.className = &#x27;vr-arrow-wide&#x27;;
      wide.textContent = &#x27;→&#x27;;
      const narrow = document.createElement(&#x27;span&#x27;);
      narrow.className = &#x27;vr-arrow-narrow&#x27;;
      narrow.textContent = &#x27;↓&#x27;;
      arrow.append(wide, narrow);
      return arrow;
    }

    function renderLinear(view) {
      const flow = document.createElement(&#x27;div&#x27;);
      flow.className = &#x27;vr-linear&#x27;;
      view.steps.forEach(function (step, index) {
        if (index &gt; 0) {
          flow.appendChild(makeArrow());
        }
        flow.appendChild(makeStepButton(step, index));
      });
      canvas.replaceChildren(flow);
    }

    function renderLanes(view) {
      const lanes = [&#x27;CPU&#x27;, &#x27;WSI&#x27;, &#x27;Graphics&#x27;, &#x27;Present&#x27;];
      const grid = document.createElement(&#x27;div&#x27;);
      grid.className = &#x27;vr-lanes&#x27;;
      lanes.forEach(function (lane) {
        const label = document.createElement(&#x27;div&#x27;);
        label.className = &#x27;vr-lane-label&#x27;;
        label.textContent = lane;
        grid.appendChild(label);
        view.steps.forEach(function (step, index) {
          const cell = document.createElement(&#x27;div&#x27;);
          cell.className = &#x27;vr-cell&#x27;;
          if (step.lane === lane) {
            cell.appendChild(makeStepButton(step, index));
          }
          grid.appendChild(cell);
        });
      });

      const mobile = document.createElement(&#x27;div&#x27;);
      mobile.className = &#x27;vr-linear vr-mobile-frame&#x27;;
      view.steps.forEach(function (step, index) {
        if (index &gt; 0) {
          mobile.appendChild(makeArrow());
        }
        mobile.appendChild(makeStepButton(step, index));
      });
      canvas.replaceChildren(grid, mobile);
    }

    function renderCanvas() {
      const view = views[activeView];
      if (view.kind === &#x27;lanes&#x27;) {
        renderLanes(view);
      } else {
        renderLinear(view);
      }
      viewLabel.textContent = view.label;
      indexLegend.hidden = activeView !== &#x27;frame&#x27;;
      renderSelection();
    }

    function renderSelection() {
      const view = views[activeView];
      const step = view.steps[activeStep];
      const buttons = Array.from(canvas.querySelectorAll(&#x27;[data-step-index]&#x27;));
      buttons.forEach(function (button) {
        const selected = Number(button.dataset.stepIndex) === activeStep;
        button.classList.toggle(&#x27;btn-primary&#x27;, selected);
        button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
      });

      progress.textContent = &#x27;步骤 &#x27; + (activeStep + 1) + &#x27; / &#x27; + view.steps.length;
      prevButton.disabled = activeStep === 0;
      nextButton.disabled = activeStep === view.steps.length - 1;

      const strong = document.createElement(&#x27;strong&#x27;);
      strong.textContent = step.label;
      const explanation = document.createTextNode(&#x27; — &#x27; + step.detail + &#x27; &#x27;);
      const source = document.createElement(&#x27;code&#x27;);
      source.textContent = step.source;
      const content = [strong, explanation, source];
      if (step.risk) {
        const badge = document.createElement(&#x27;span&#x27;);
        badge.className = &#x27;viz-badge&#x27;;
        badge.textContent = step.risk;
        content.push(document.createTextNode(&#x27; &#x27;), badge);
      }
      detail.replaceChildren.apply(detail, content);
    }

    function selectView(viewName) {
      activeView = viewName;
      activeStep = 0;
      viewButtons.forEach(function (button) {
        const selected = button.dataset.view === activeView;
        button.classList.toggle(&#x27;btn-primary&#x27;, selected);
        button.setAttribute(&#x27;aria-selected&#x27;, String(selected));
      });
      renderCanvas();
    }

    viewButtons.forEach(function (button) {
      button.addEventListener(&#x27;click&#x27;, function () {
        selectView(button.dataset.view);
      });
    });
    prevButton.addEventListener(&#x27;click&#x27;, function () {
      activeStep = Math.max(0, activeStep - 1);
      renderSelection();
    });
    nextButton.addEventListener(&#x27;click&#x27;, function () {
      activeStep = Math.min(views[activeView].steps.length - 1, activeStep + 1);
      renderSelection();
    });

    selectView(&#x27;overview&#x27;);
  }());
&lt;/script&gt;
